<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafarSetu</title>

    <!-- Preconnect to font origins: shaves connection-setup time off the critical chain -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preconnect to backend API -->
    <link rel="preconnect" href="https://safarsetux.onrender.com" />

    <!-- Real <link> instead of a JS-injected @import: discoverable immediately, not render-blocking on JS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Preload the LCP image (About section hero image) at high priority.
         Path corrected to match actual file being served. -->
    <link rel="preload" as="image" href="/images/about_hero.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
